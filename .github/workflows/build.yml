name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply changes
        run: patch -p1 < cambios.patch

      - name: Fix signing config for debug builds
        run: |
          sed -i 's|storeFile = file(keystoreProperties.getProperty("RELEASE_STORE_FILE") ?: "")|if (keystoreProperties.getProperty("RELEASE_STORE_FILE") != null) storeFile = file(keystoreProperties.getProperty("RELEASE_STORE_FILE"))|' app/build.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: FlowBytes-apk
          path: app/build/outputs/apk/debug/*.apk
